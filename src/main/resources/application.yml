spring:
  application:
    name: ecomerce
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecomerce_db}
    username: ${DB_USERNAME:ecomerce_user}
    password: ${DB_PASSWORD:ecomerce_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: EcommerceHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      validation-timeout: 5000
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
server:
  servlet:
    context-path: /ecommerce-api
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 500
    max-connections: 8192
    connection-timeout: 20000

jwt:
  secret: ${JWT_SECRET:ZmFrZUV4YW1wbGVTZWNyZXRLZXlGb3JIUzI1NkFsZ29yaXRobVRlc3Q=}
  expiration: ${JWT_EXPIRATION:900000} #15 minutes
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days
