worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    access_log off;
    resolver 127.0.0.11 valid=10s;

    upstream ecomerce_app {
        # Round-robin across all "app" service replicas (resolved via Docker DNS).
        server app:8080 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80 backlog=4096;

        # Large backlog so bursts of concurrent connections aren't refused at the LB edge.
        location / {
            proxy_pass http://ecomerce_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}