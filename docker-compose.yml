services:
  postgres:
    image: postgres:16-alpine
    container_name: ecomerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ecomerce_db}
      POSTGRES_USER: ${DB_USERNAME:-ecomerce_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ecomerce_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ecomerce_user} -d ${DB_NAME:-ecomerce_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: ecomerce-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-ecomerce_db}
      DB_USERNAME: ${DB_USERNAME:-ecomerce_user}
      DB_PASSWORD: ${DB_PASSWORD:-ecomerce_pass}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: ecomerce-nginx
    restart: unless-stopped
    ports:
      - "9080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

volumes:
  postgres_data:

